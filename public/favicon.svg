<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Deep Obsidian Tile Gradient -->
    <linearGradient id="tileBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c101d" />
      <stop offset="50%" stop-color="#060810" />
      <stop offset="100%" stop-color="#020307" />
    </linearGradient>

    <!-- Multi-Stop Neon Rim Gradient -->
    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="30%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Electric Cyan Gradient -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Chrome & Radiant White Gradient for GS -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#7dd3fc" />
    </linearGradient>

    <!-- Radial Ambient Backlight -->
    <radialGradient id="ambientCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.38" />
      <stop offset="55%" stop-color="#6366f1" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter for Large GS Text -->
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#38bdf8" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Luxury App Tile Squircle Base -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#tileBg)" stroke="url(#neonBorder)" stroke-width="12" />

  <!-- Ambient Light Core -->
  <circle cx="256" cy="256" r="210" fill="url(#ambientCyan)" />

  <!-- React Native Atomic Orbits -->
  <g transform="translate(256, 256)" stroke="url(#cyanGlow)" stroke-width="20" fill="none" stroke-linecap="round">
    <!-- Orbit 1 (Horizontal) -->
    <ellipse rx="200" ry="80" />
    <!-- Orbit 2 (60 deg) -->
    <ellipse rx="200" ry="80" transform="rotate(60)" />
    <!-- Orbit 3 (120 deg) -->
    <ellipse rx="200" ry="80" transform="rotate(120)" />
  </g>

  <!-- Large Central Obsidian Glass Shield for GS -->
  <circle cx="256" cy="256" r="134" fill="#080c16" stroke="url(#cyanGlow)" stroke-width="9" />
  <circle cx="256" cy="256" r="122" fill="#0c1322" fill-opacity="0.9" />

  <!-- Extra-Bold, Extra-Large & Dominant "GS" Monogram -->
  <text
    x="256"
    y="308"
    text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif"
    font-size="142"
    font-weight="900"
    letter-spacing="-3"
    fill="url(#textGrad)"
    filter="url(#textShadow)"
  >GS</text>

  <!-- Glowing Accent Micro-Particle -->
  <circle cx="410" cy="102" r="14" fill="#38bdf8" />
  <circle cx="410" cy="102" r="22" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.5" />
</svg>