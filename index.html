<!doctype html>
<html lang="en" data-theme="light" class="is-loading">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gurpreet Singh — Senior React Native Developer | iOS (Swift)</title>
    <meta name="description" content="Gurpreet Singh is a Senior React Native Developer with 7+ years of experience designing, developing, and maintaining high-quality mobile applications using React Native and Native iOS (Swift)." />
    <meta property="og:title" content="Gurpreet Singh — Senior React Native Developer | iOS (Swift)" />
    <meta property="og:description" content="Senior React Native Developer with 7+ years of experience building scalable applications, integrating payment gateways, subscription platforms, analytics, and third-party SDKs." />
    <meta property="og:type" content="website" />
    
    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Instant splash — paints before React/JS bundle loads -->
    <style>
      html.is-loading { overflow: hidden; }
      #page-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f8fafc;
        color: #0f172a;
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        transition: opacity 0.45s ease, visibility 0.45s ease;
      }
      #page-loader.is-done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .page-loader__inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.25rem;
        padding: 1.5rem;
        text-align: center;
      }
      .page-loader__mark {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        background: #ffffff;
        border: 1px solid rgba(37, 99, 235, 0.25);
        box-shadow: 0 8px 28px rgba(37, 99, 235, 0.12);
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: 1.35rem;
        letter-spacing: -0.04em;
        animation: loaderPulse 1.6s ease-in-out infinite;
      }
      .page-loader__mark span {
        background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .page-loader__name {
        font-size: 0.95rem;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: #0f172a;
      }
      .page-loader__sub {
        font-size: 0.75rem;
        color: #64748b;
        margin-top: -0.65rem;
      }
      .page-loader__track {
        width: min(200px, 55vw);
        height: 3px;
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.08);
        overflow: hidden;
      }
      .page-loader__bar {
        height: 100%;
        width: 12%;
        border-radius: inherit;
        background: linear-gradient(90deg, #2563eb, #7c3aed, #ec4899);
        background-size: 200% 100%;
        animation: loaderBar 1.4s ease-in-out infinite, loaderFill 2.2s ease-out forwards;
      }
      @keyframes loaderPulse {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 8px rgba(37, 99, 235, 0.2)); }
        50% { transform: scale(1.04); filter: drop-shadow(0 0 18px rgba(124, 58, 237, 0.28)); }
      }
      @keyframes loaderBar {
        0% { background-position: 0% 50%; }
        100% { background-position: 100% 50%; }
      }
      @keyframes loaderFill {
        0% { width: 8%; }
        70% { width: 78%; }
        100% { width: 92%; }
      }
    </style>
  </head>
  <body>
    <div id="page-loader" role="status" aria-live="polite" aria-label="Loading portfolio">
      <div class="page-loader__inner">
        <div class="page-loader__mark" aria-hidden="true"><span>GS</span></div>
        <div class="page-loader__name">Gurpreet Singh</div>
        <div class="page-loader__sub">Loading portfolio…</div>
        <div class="page-loader__track" aria-hidden="true">
          <div class="page-loader__bar"></div>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
